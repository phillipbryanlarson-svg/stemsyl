<svg xmlns="http://www.w3.org/2000/svg" width="1664" height="160" viewBox="0 0 832 80" role="img" aria-label="Stemsyl punctuation and the name mark"><title>Stemsyl punctuation and the name mark</title><style>.stem{stroke:#2C2C2A;stroke-width:2;fill:none;stroke-linecap:round}.tk{stroke-width:7.5;fill:none;stroke-linecap:round}
.f-ink{stroke:#2C2C2A}.f-rose{stroke:#B65754}.f-mauve{stroke:#A55B91}.f-indigo{stroke:#4848B9}.f-blue{stroke:#238DC0}.f-emerald{stroke:#229279}.f-olive{stroke:#4F7103}.f-amber{stroke:#A19005}
.f-red{stroke:#c40027}.f-orange{stroke:#8f2400}.f-yellow{stroke:#d4a900}.f-green{stroke:#236b27}.f-vblue{stroke:#002fec}.f-grey{stroke:#5f5f5f}.f-violet{stroke:#582684}
.numdot,.namemk,.numon{fill:#534AB7;stroke:none}.numoff{fill:#9c9a92;opacity:.22}.pn{stroke:#534AB7;stroke-width:3.6;fill:none;stroke-linecap:round}
text{font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#2C2C2A}
.lb{font-size:11px;font-weight:700;text-anchor:middle}.sm{font-size:8.5px;fill:#6f6d66;text-anchor:middle}.ip{font-size:10px;text-anchor:middle;font-family:"Charis SIL","Doulos SIL","Noto Serif","DejaVu Serif",serif}
.hd{font-size:10px;font-weight:700;text-anchor:middle;letter-spacing:.04em}.rl{font-size:10px;font-weight:700;text-anchor:end;fill:#6f6d66}
.an{font-size:9.5px;fill:#2C2C2A}.ln{stroke:#9c9a92;stroke-width:.8;fill:none}
.t-ink{fill:#2C2C2A}.t-rose{fill:#B65754}.t-mauve{fill:#A55B91}.t-indigo{fill:#4848B9}.t-blue{fill:#238DC0}.t-emerald{fill:#229279}.t-olive{fill:#4F7103}.t-amber{fill:#A19005}
.t-red{fill:#c40027}.t-orange{fill:#8f2400}.t-yellow{fill:#a88600}.t-green{fill:#236b27}.t-vblue{fill:#002fec}.t-grey{fill:#5f5f5f}.t-violet{fill:#582684}</style><rect width="832" height="80" fill="#ffffff"/><g transform="translate(17 0)"><circle class="numdot" cx="15" cy="46" r="4.6"/></g><text class="sm" x="32" y="72">full stop</text><g transform="translate(81 0)"><path class="pn" style="stroke-width:4.4" d="M 18 38 L 11 51"/></g><text class="sm" x="96" y="72">comma</text><g transform="translate(145 0)"><path class="pn" d="M 8 21 C 8 13, 22 13, 22 21 C 22 29, 15 29, 15 36"/><circle class="numdot" cx="15" cy="46" r="3.4"/></g><text class="sm" x="160" y="72">question</text><g transform="translate(209 0)"><path class="pn" d="M 15 14 L 15 38"/><circle class="numdot" cx="15" cy="47" r="3.4"/></g><text class="sm" x="224" y="72">exclamation</text><g transform="translate(273 0)"><circle class="numdot" cx="15" cy="24" r="4"/><circle class="numdot" cx="15" cy="44" r="4"/></g><text class="sm" x="288" y="72">colon</text><g transform="translate(337 0)"><circle class="numdot" cx="15" cy="24" r="4"/><path class="pn" style="stroke-width:4.4" d="M 18 40 L 11 52"/></g><text class="sm" x="352" y="72">semicolon</text><g transform="translate(401 0)"><path class="pn" d="M 8 17 L 24 17 M 8 17 L 8 31"/></g><text class="sm" x="416" y="72">open quote</text><g transform="translate(465 0)"><path class="pn" d="M 22 47 L 6 47 M 22 47 L 22 33"/></g><text class="sm" x="480" y="72">close quote</text><g transform="translate(529 0)"><path class="pn" d="M 20 10 C 8 20, 8 44, 20 54"/></g><text class="sm" x="544" y="72">open bracket</text><g transform="translate(593 0)"><path class="pn" d="M 10 10 C 22 20, 22 44, 10 54"/></g><text class="sm" x="608" y="72">close bracket</text><g transform="translate(657 0)"><path class="pn" d="M 4 46 L 26 46"/></g><text class="sm" x="672" y="72">dash</text><g transform="translate(721 0)"><path class="pn" d="M 22 12 L 8 52"/></g><text class="sm" x="736" y="72">slash</text><g transform="translate(790 20)"><path class="namemk" d="M 11 6 L 17 13 L 11 20 L 5 13 Z"/></g><text class="sm" x="800" y="72">name mark</text></svg>