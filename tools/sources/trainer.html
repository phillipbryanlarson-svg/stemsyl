<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Practise reading Stemsyl, the seven-dot phonetic script for English: sounds, words, sentences and numbers. Works offline.">
<title>Stemsyl Trainer</title>
<style>
:root{
  --bg:#f5f5f0; --card:#ffffff; --text:#2C2C2A; --muted:#6f6d66; --faint:#8a8880;
  --frame:#9c9a92; --stem:#3d3d3a; --mark:#534AB7; --mark-ink:#ffffff;
  /* tick colours, chosen to stay apart for normal, red-weak and green-weak vision; the hue keeps across themes */
  --ink:#2C2C2A; --rose:#B65754; --mauve:#A55B91; --indigo:#4848B9; --blue:#238DC0; --emerald:#229279; --olive:#4F7103; --amber:#A19005;
  --ok:#3B6D11; --okbg:#EAF3DE; --bad:#A32D2D; --badbg:#FCEBEB;
  --border:#e8e6dd; --chip:#faf9f5;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#171715; --card:#232321; --text:#e8e6dd; --muted:#b4b2a9; --faint:#9c9a92;
    --frame:#8b8a83; --stem:#c2c0b6; --mark:#AFA9EC; --mark-ink:#17152A;
    --ink:#E8E6DD; --rose:#E07B77; --mauve:#D487BE; --indigo:#9084FF; --blue:#6FC6FC; --emerald:#55BCA1; --olive:#BCDD73; --amber:#A6940E;
    --ok:#97C459; --okbg:#27500A; --bad:#F09595; --badbg:#501313;
    --border:#37372f; --chip:#2b2b28;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#171715; --card:#232321; --text:#e8e6dd; --muted:#b4b2a9; --faint:#9c9a92;
  --frame:#8b8a83; --stem:#c2c0b6; --mark:#AFA9EC; --mark-ink:#17152A;
  --ink:#E8E6DD; --rose:#E07B77; --mauve:#D487BE; --indigo:#9084FF; --blue:#6FC6FC; --emerald:#55BCA1; --olive:#BCDD73; --amber:#A6940E;
  --ok:#97C459; --okbg:#27500A; --bad:#F09595; --badbg:#501313;
  --border:#37372f; --chip:#2b2b28;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden],.hide{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.app{max-width:640px;width:100%;margin:0 auto;padding:14px 16px 18px;flex:1;display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stat{font-size:13px;color:var(--muted);line-height:1.4;font-variant-numeric:tabular-nums}
.stat b{color:var(--text);font-weight:600}
.spacer{flex:1}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);padding:9px 14px;font-size:14px}
button:active{transform:translateY(1px)}
button.primary{background:var(--mark);border-color:var(--mark);color:var(--mark-ink);font-weight:600}
:focus-visible{outline:2px solid var(--mark);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;padding:6px 11px;border-radius:999px;border:1px solid var(--border);background:var(--chip);color:var(--muted);cursor:pointer;user-select:none}
.chip[aria-pressed="true"]{background:var(--mark);border-color:var(--mark);color:var(--mark-ink);font-weight:600}
#card{position:relative;background:var(--card);border:1px solid var(--border);border-radius:18px;flex:1;min-height:340px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:22px 16px;
  cursor:pointer;user-select:none;text-align:center;--glyphbg:var(--card)}
#glyph{width:100%;display:flex;justify-content:center}
#glyph svg{display:block;width:100%;height:auto;overflow:visible}
#ans{font-size:clamp(40px,12vw,84px);font-weight:800;letter-spacing:-.02em;line-height:1.05;margin:0;overflow-wrap:anywhere}
#ans.long{font-size:clamp(22px,6vw,34px);font-weight:700;letter-spacing:0;line-height:1.3}
#meta{font-size:15px;color:var(--text);margin-top:8px}
#meta2{font-size:13.5px;color:var(--muted);margin-top:4px;line-height:1.5;max-width:460px;margin-inline:auto}
.ipa{font-family:"Charis SIL","Doulos SIL","Gentium Plus","Noto Serif","DejaVu Serif","Times New Roman",serif}
#hint{font-size:13px;color:var(--muted)}
.verdict{font-size:15px;font-weight:600;padding:7px 16px;border-radius:999px}
.verdict.ok{background:var(--okbg);color:var(--ok)}
.verdict.bad{background:var(--badbg);color:var(--bad)}
footer{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
input{font:inherit;font-size:16px;padding:12px 14px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);flex:1;min-width:0}
input:focus{outline:2px solid var(--mark);outline-offset:-1px}
#err{width:100%;font-size:13px;color:var(--bad);min-height:17px}
#summary{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:34px 22px;text-align:center;flex:1;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
#summary h2{font-size:17px;font-weight:600;margin:0}
#pct{font-size:clamp(56px,20vw,120px);font-weight:800;line-height:1}
.srow{font-size:15px;color:var(--muted)}
.srow b{color:var(--text)}
.say{position:absolute;top:12px;right:12px;width:44px;height:44px;padding:0;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:var(--chip);color:var(--mark)}
.say svg,.snd svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.say.on{background:var(--mark);border-color:var(--mark);color:var(--mark-ink)}
.snd{display:flex;align-items:center;gap:6px;padding:7px 12px}
.snd svg{width:18px;height:18px}
.snd[aria-pressed="false"]{color:var(--muted)}
.snd[aria-pressed="false"] .wave{display:none}
.snd[aria-pressed="true"] .mute{display:none}
nav.links{font-size:12.5px;color:var(--faint);text-align:center}
nav.links a{color:var(--mark);text-decoration:none;font-weight:600}
nav.links b{color:var(--muted);font-weight:600}
nav.links a:hover{text-decoration:underline}
/* the glyphs: a stem and three coloured ticks */
.stem{stroke:var(--ink);stroke-width:2;fill:none;stroke-linecap:round}
.tk{stroke-width:7.5;fill:none;stroke-linecap:round}
.f-ink{stroke:var(--ink)} .f-rose{stroke:var(--rose)} .f-mauve{stroke:var(--mauve)} .f-indigo{stroke:var(--indigo)}
.f-blue{stroke:var(--blue)} .f-emerald{stroke:var(--emerald)} .f-olive{stroke:var(--olive)} .f-amber{stroke:var(--amber)}
.t-ink,.t-rose,.t-mauve,.t-indigo,.t-blue,.t-emerald,.t-olive,.t-amber{font-weight:600}
.t-ink{color:var(--ink)} .t-rose{color:var(--rose)} .t-mauve{color:var(--mauve)} .t-indigo{color:var(--indigo)}
.t-blue{color:var(--blue)} .t-emerald{color:var(--emerald)} .t-olive{color:var(--olive)} .t-amber{color:var(--amber)}
.numdot{fill:var(--mark);stroke:none}
.pn{stroke:var(--mark);stroke-width:3.6;fill:none;stroke-linecap:round}
.namemk{fill:var(--mark)}
.numon{fill:var(--mark)}
.numoff{fill:var(--frame);opacity:.22}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="stat" aria-live="polite">Typed <b id="sAcc">0/0</b> &nbsp;·&nbsp; Revealed <b id="sRev">0</b></div>
    <div class="spacer"></div>
    <button id="sound" class="snd" type="button" aria-pressed="true" title="Play each sound when the answer is shown"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13L7.5 14.5H4z"/><path class="wave" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/><path class="mute" d="M16 9.5l5 5M21 9.5l-5 5"/></svg><span>Sound</span></button>
    <button id="finish">Finish</button>
  </header>

  <div class="chips" id="chips" role="group" aria-label="What to practise"></div>

  <main id="card" role="button" tabindex="0" aria-label="Glyph card. Tap or press Enter to reveal the answer.">
    <button id="say" class="say hide" type="button" aria-label="Play the sound again"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13L7.5 14.5H4z"/><path class="wave" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg></button>
    <div id="glyph"></div>
    <div id="answer" class="hide">
      <p id="ans"></p>
      <div id="meta"></div>
      <div id="meta2"></div>
    </div>
    <div id="verdict" class="hide" role="status"></div>
    <div id="hint">tap to reveal</div>
  </main>

  <footer id="foot">
    <input id="input" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
           placeholder="type what it says (optional)" aria-label="Your answer">
    <button class="primary" id="check">Check</button>
    <div id="err" role="alert"></div>
  </footer>

  <div id="summary" class="hide">
    <h2>Session accuracy</h2>
    <div id="pct">—</div>
    <div class="srow" id="sDetail"></div>
    <div class="srow" id="sRevDetail"></div>
    <div class="srow" id="sMiss"></div>
    <button class="primary" id="again" style="margin-top:14px">Start again</button>
  </div>

  <nav class="links"><b>Stemsyl trainer</b> &nbsp;·&nbsp; <a href="stemsyl.html" target="_blank" rel="noopener">Specification</a> &nbsp;·&nbsp; <a href="stemsyl-keyboard.html" target="_blank" rel="noopener">Keyboard</a> &nbsp;·&nbsp; voice: eSpeak NG</nav>
</div>

<script>
/* ---------- geometry: the three-tick script ---------- */
/* ============ Stemsyl, three-tick edition: General American ============
   A syllable is a short horizontal stem with up to three ticks on it:
       left tick   the consonant before the vowel
       middle tick the vowel
       right tick  the consonant after it
   Every tick has three positions (up, centred across the stem, down) and a colour, so each tick
   says one whole sound. A consonant that belongs to neither side of a vowel sits on a stub of its own.

   Consonants come in eight families of three. The colour is the family, running round the colour
   wheel from the lips to the back of the tongue; the position is which of the three:
       up voiceless · centred the family's sonorant · down voiced
         ink      t  n  d        the tongue tip
         rose     p  m  b        the lips
         mauve    f  w  v        lip and teeth
         indigo   th h  dh       the teeth, and breath
         blue     s  l  z        the tongue tip hissing
         emerald  sh r  zh       the hush
         olive    ch y  j
         amber    k  ng g        the back of the tongue
   Neighbouring colours are the likeliest to be confused, so a misread lands on a related sound.

   Vowels: the colour is the vowel, and each colour's name starts with its sound:
   amber a, emerald e, indigo i, olive o (hot), blue oo; ink is schwa.
       centred the plain vowel · up glides to i · down glides to u
   so ee (i going to i) is indigo up and oo (u going to u) is blue down. Ink down is aw. */
var SYL_W=42, LONE_W=18, GH=64, CY=32;
var TX=[9,21,33], LONE_X=9, STEM=[5,37], LONE_STEM=[4,14];
var TL=14, TICK_W=7.5;   /* fat ticks: measured against English at equal area with a model of colour acuity, thin ticks
                             lose their colour to the eye's blur; at this weight they read better than English type */
function wrapW(inner,w){ return '<svg viewBox="0 0 '+w+' '+GH+'" width="'+w+'" height="'+GH+'" xmlns="http://www.w3.org/2000/svg">'+inner+'</svg>'; }
var TICKY={u:[CY-TL,CY],c:[CY-TL/2,CY+TL/2],d:[CY,CY+TL]};
function tick(x,t){ if(!t) return ''; var y=TICKY[t[1]];
  return '<path class="tk f-'+t[0]+'" d="M '+x+' '+y[0]+' L '+x+' '+y[1]+'"/>'; }
function stem(a,b){ return '<path class="stem" d="M '+a+' '+CY+' L '+b+' '+CY+'"/>'; }

/* ---------- the consonant codes: [colour family, position] ---------- */
/* compact letters: T th  D dh  S sh  Z zh  C ch  J j(dʒ)  N ng  y y(j)  h h */
var CODE={
  t:['ink','u'],     n:['ink','c'],     d:['ink','d'],
  p:['rose','u'],    m:['rose','c'],    b:['rose','d'],
  f:['mauve','u'],   w:['mauve','c'],   v:['mauve','d'],
  T:['indigo','u'],  h:['indigo','c'],  D:['indigo','d'],
  s:['blue','u'],    l:['blue','c'],    z:['blue','d'],
  S:['emerald','u'], r:['emerald','c'], Z:['emerald','d'],
  C:['olive','u'],   y:['olive','c'],   J:['olive','d'],
  k:['amber','u'],   N:['amber','c'],   g:['amber','d']
};
var CONS_IPA={p:'p',b:'b',t:'t',d:'d',k:'k',g:'ɡ',f:'f',v:'v',T:'θ',D:'ð',s:'s',z:'z',S:'ʃ',Z:'ʒ',h:'h',C:'tʃ',J:'dʒ',
  m:'m',n:'n',N:'ŋ',l:'l',r:'r',w:'w',y:'j'};
var CONS_NAME={p:'p',b:'b',t:'t',d:'d',k:'k',g:'g',f:'f',v:'v',T:'th',D:'dh',s:'s',z:'z',S:'sh',Z:'zh',h:'h',C:'ch',J:'j',
  m:'m',n:'n',N:'ng',l:'l',r:'r',w:'w',y:'y'};
var CONS_EX={p:'pie',b:'buy',t:'tie',d:'die',k:'kite',g:'guy',f:'fee',v:'vee',T:'thigh',D:'thy',s:'sue',z:'zoo',S:'shoe',Z:'vision',
  h:'high',C:'chew',J:'jaw',m:'my',n:'nigh',N:'sing',l:'lie',r:'rye',w:'why',y:'yes'};

/* ---------- vowels: [start, end] ---------- */
/* start '' = schwa. end '' short · same letter long · 'i' to i · 'u' to u.
   General American says hot and father with the same vowel, so o (LOT) is written as ah (PALM). */
var VCHAR={'@':['','@'],a:['a',''],A:['a','a'],Y:['a','i'],W:['a','u'],i:['i',''],I:['i','i'],u:['u',''],U:['u','u'],
  e:['e',''],E:['e','i'],o:['a','a'],O:['o','o'],G:['o','u'],B:['o','i']};
function vowelKey(v){ return v[0]+'|'+v[1]; }
var VIPA={'|@':'ə','a|':'æ','a|a':'ɑ','a|i':'aɪ','a|u':'aʊ','i|':'ɪ','i|i':'i','u|':'ʊ','u|u':'u',
  'e|':'ɛ','e|i':'eɪ','o|o':'ɔ','o|i':'ɔɪ','o|u':'oʊ'};
var VSET={'|@':'commA · STRUT','a|':'TRAP','a|a':'PALM · LOT','a|i':'PRICE','a|u':'MOUTH','i|':'KIT','i|i':'FLEECE','u|':'FOOT','u|u':'GOOSE',
  'e|':'DRESS','e|i':'FACE','o|o':'THOUGHT','o|u':'GOAT','o|i':'CHOICE'};
/* the vowel tick: [colour family, position] */
var VTICK={'|@':['ink','c'],'o|o':['ink','d'],
  'a|':['amber','c'],'a|i':['amber','u'],'a|u':['amber','d'],
  'e|':['emerald','c'],'e|i':['emerald','u'],
  'i|':['indigo','c'],'i|i':['indigo','u'],
  'a|a':['olive','c'],'o|i':['olive','u'],'o|u':['olive','d'],
  'u|':['blue','c'],'u|u':['blue','d']};
function vowelTick(v){ return VTICK[vowelKey(v)]; }

/* ---------- glyphs ---------- */
/* a syllable: onset and coda are consonant letters (or null), vowel is [start, end] */
function syllableInner(on,vw,co){
  return stem(STEM[0],STEM[1])+tick(TX[0],on?CODE[on]:null)+tick(TX[1],vowelTick(vw))+tick(TX[2],co?CODE[co]:null);
}
function syllable(on,vw,co){ return wrapW(syllableInner(on,vw,co),SYL_W); }
function loneInner(c){ return stem(LONE_STEM[0],LONE_STEM[1])+tick(LONE_X,CODE[c]); }
function lone(c){ return wrapW(loneInner(c),LONE_W); }
function consGlyph(c){ return lone(c); }

/* ---------- punctuation, numerals, the name mark ---------- */
var PUNCT_W=30;
var PUNCT={
  '.':'<circle class="numdot" cx="15" cy="46" r="4.6"/>',
  ',':'<path class="pn" style="stroke-width:4.4" d="M 18 38 L 11 51"/>',
  '!':'<path class="pn" d="M 15 14 L 15 38"/><circle class="numdot" cx="15" cy="47" r="3.4"/>',
  '?':'<path class="pn" d="M 8 21 C 8 13, 22 13, 22 21 C 22 29, 15 29, 15 36"/><circle class="numdot" cx="15" cy="46" r="3.4"/>',
  '“':'<path class="pn" d="M 8 17 L 24 17 M 8 17 L 8 31"/>',
  '”':'<path class="pn" d="M 22 47 L 6 47 M 22 47 L 22 33"/>',
  ':':'<circle class="numdot" cx="15" cy="24" r="4"/><circle class="numdot" cx="15" cy="44" r="4"/>',
  ';':'<circle class="numdot" cx="15" cy="24" r="4"/><path class="pn" style="stroke-width:4.4" d="M 18 40 L 11 52"/>',
  '(':'<path class="pn" d="M 20 10 C 8 20, 8 44, 20 54"/>',
  ')':'<path class="pn" d="M 10 10 C 22 20, 22 44, 10 54"/>',
  '–':'<path class="pn" d="M 4 46 L 26 46"/>',
  '/':'<path class="pn" d="M 22 12 L 8 52"/>'
};
function punct(ch){ return wrapW(PUNCT[ch]||'',PUNCT_W); }
/* numerals: the Intuitive Clock's digits. Each is a 3 × 3 grid of square dots, and a digit is
   as many dots as its value, laid out like dice: 1 the centre, 2 the middle row's ends, 3 the middle row,
   4 the corners, 5 corners and centre, 6 adds the top middle, 7 the bottom middle, 8 the ring, 9 all nine.
   0 is the empty grid. Empty slots stay faintly visible, so a reader can count, not remember.
   The middle row sits on the syllables' centre line, so 1, 2 and 3 run along the same line as the words. */
var NUM_W=48, NUM_U=10.4, NUM_G=2.08;
var NUMMASK=(function(){
  var P={0:[],1:[[2,2]],2:[[2,1],[2,3]],3:[[2,1],[2,2],[2,3]],4:[[1,1],[1,3],[3,1],[3,3]]};
  P[5]=P[4].concat([[2,2]]); P[6]=P[5].concat([[1,2]]); P[7]=P[6].concat([[3,2]]);
  P[8]=[[1,1],[1,2],[1,3],[2,1],[2,3],[3,1],[3,2],[3,3]]; P[9]=P[8].concat([[2,2]]);
  var M=[]; for(var n=0;n<=9;n++) M[n]=P[n].reduce(function(m,rc){ return m|(1<<((rc[0]-1)*3+(rc[1]-1))); },0);
  return M;
})();
function numSq(cls,x,y,s){ return '<rect class="'+cls+'" x="'+x.toFixed(2)+'" y="'+y.toFixed(2)+'" width="'+s.toFixed(2)+'" height="'+s.toFixed(2)+'" rx="'+(0.12*NUM_U*s/NUM_U).toFixed(2)+'"/>'; }
function numeralInner(d){
  var u=NUM_U, g=NUM_G, x0=(NUM_W-3*u-2*g)/2, y0=CY-(3*u+2*g)/2, h='';
  for(var i=0;i<9;i++){ var on=(NUMMASK[d]>>i)&1;
    h+=numSq(on?'numon':'numoff',x0+(i%3)*(u+g),y0+Math.floor(i/3)*(u+g),u); }
  return h;
}
function numeral(d){ return wrapW(numeralInner(d),NUM_W); }
/* the clock's own separators, in the numerals' square dots: a time colon and a decimal point */
var NSIGN_W={':':20,'.':14,',':12};
function numSignInner(ch){
  var s=NUM_U*0.5, w=NSIGN_W[ch]||14, x=(w-s)/2;
  if(ch===':') return numSq('numon',x,CY-NUM_U*0.95,s)+numSq('numon',x,CY+NUM_U*0.45,s);
  if(ch==='.') return numSq('numon',x,CY+(3*NUM_U+2*NUM_G)/2-s,s);
  return '';                                   /* ',' groups digits with a thin gap */
}
function numSign(ch){ return wrapW(numSignInner(ch),NSIGN_W[ch]||14); }
var NAME_W=22;
function nameMark(){ return wrapW('<path class="namemk" d="M 11 6 L 17 13 L 11 20 L 5 13 Z"/>',NAME_W); }

/* ---------- English words as sounds: compact dictionary letters -> units ---------- */
var CONS_LETTERS='pbtdkgfvTDszSZhCJmnNlrwy';
function isVowelChar(ch){ return !!VCHAR[ch]; }
/* phoneme list: consonant letters and vowels [start,end] */
function phonemes(str){ var out=[]; for(var i=0;i<str.length;i++){ var c=str.charAt(i); out.push(VCHAR[c]?VCHAR[c].slice():c); } return out; }
function isV(p){ return typeof p!=='string'; }
/* group a word's phonemes into glyphs. Each vowel takes the consonant right before it as its onset
   (never ng), then the consonant right after it as its coda unless that one starts the next syllable
   (h, y and w never close a syllable). Every other consonant stands alone as three dots. */
function syllabify(ph){
  var n=ph.length, role=new Array(n), i, units=[];
  for(i=0;i<n;i++) role[i]=null;
  for(i=0;i<n;i++) if(isV(ph[i]) && i>0 && !isV(ph[i-1]) && ph[i-1]!=='N' && role[i-1]===null) role[i-1]='on'+i;
  for(i=0;i<n;i++) if(isV(ph[i])){ var j=i+1;
    if(j<n && !isV(ph[j]) && role[j]===null && 'hywH'.indexOf(ph[j])<0) role[j]='co'+i; }
  for(i=0;i<n;i++){
    if(isV(ph[i])){
      var on= i>0 && role[i-1]==='on'+i ? ph[i-1] : null;
      var co= i+1<n && role[i+1]==='co'+i ? ph[i+1] : null;
      units.push({k:'S',on:on,v:ph[i],co:co,from:on?i-1:i,to:co?i+2:i+1});
    } else if(role[i]===null) units.push({k:'C',c:ph[i],from:i,to:i+1});
  }

/* ---------- state: this browser keeps your score and what you miss ---------- */
var KEY='stemsyl_trainer_v3';

/* ---------- playing sounds: decoded on first use and cached; no network, no files ---------- */
var AC=null, DEC={}, LIVE=[], playTok=null, audioOK=!!(window.AudioContext||window.webkitAudioContext);
function actx(){
  if(!audioOK) return null;
  if(!AC){
    try{ if(navigator.audioSession) navigator.audioSession.type='playback'; }catch(e){}   /* let iPhones play with the ringer off */
    try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ audioOK=false; return null; }
  }
  if(AC.state==='suspended'&&AC.resume) AC.resume();
  return AC;
}
function bytesOf(b64){ var s=atob(b64), a=new Uint8Array(s.length); for(var i=0;i<s.length;i++) a[i]=s.charCodeAt(i); return a.buffer; }
function trimmed(ac,b){   /* MP3 adds a little silence at each end: cut it so joined words run on */
  var d=b.getChannelData(0), th=0.004, i=0, j=d.length-1;
  while(i<j&&Math.abs(d[i])<th) i++;
  while(j>i&&Math.abs(d[j])<th) j--;
  var pad=Math.round(b.sampleRate*0.004); i=Math.max(0,i-pad); j=Math.min(d.length-1,j+pad);
  var out=ac.createBuffer(1,j-i+1,b.sampleRate); out.getChannelData(0).set(d.subarray(i,j+1)); return out;
}
function clip(key){
  if(DEC[key]) return DEC[key];
  var ac=actx(); if(!ac||!SND[key]) return Promise.reject(new Error('no sound for '+key));
  DEC[key]=new Promise(function(res,rej){
    try{ ac.decodeAudioData(bytesOf(SND[key]),function(b){ res(trimmed(ac,b)); },function(e){ delete DEC[key]; rej(e||new Error('decode')); }); }
    catch(e){ delete DEC[key]; rej(e); } });
  return DEC[key];
}
function hush(){ playTok=null; LIVE.forEach(function(s){ try{ s.stop(); }catch(e){} }); LIVE=[]; elSay.classList.remove('on'); }
function play(keys){
  hush(); var ac=actx(); if(!ac||!keys||!keys.length) return;
  var gap=/\/gb$/.test(keys[keys.length-1])?0.4:0.04, tok={}; playTok=tok;   /* a pause before the British vowel; number words run on */
  Promise.all(keys.map(clip)).then(function(bufs){
    if(playTok!==tok) return;
    var t=ac.currentTime+0.03, last=null;
    bufs.forEach(function(b){ var src=ac.createBufferSource(); src.buffer=b; src.connect(ac.destination); src.start(t); LIVE.push(src); t+=b.duration+gap; last=src; });
    elSay.classList.add('on');
    if(last) last.onended=function(){ if(playTok===tok) elSay.classList.remove('on'); };
  },function(){ elSay.classList.remove('on'); });
}
function sayable(){ return !!(audioOK&&shown&&shown.say&&shown.say.length); }

var $=function(id){ return document.getElementById(id); };
var elSay=$('say'), elSound=$('sound');
var elGlyph=$('glyph'), elAnsBox=$('answer'), elAns=$('ans'), elMeta=$('meta'), elMeta2=$('meta2'), elHint=$('hint'), elVer=$('verdict'),
    elIn=$('input'), elErr=$('err'), elCard=$('card'), elFoot=$('foot'), elSum=$('summary'), elChips=$('chips');
var cur=null, shown=null, revealed=false, graded=false;

/* items you miss come back more often: weight 1, plus 2 for each recent miss */
function pool(){ var p=ITEMS.filter(function(it){ return S.cats[it.cat]; }); return p.length?p:ITEMS; }
function weight(it){ return 1+2*(S.miss[it.id]||0); }
function pickOne(p){
  var tot=p.reduce(function(a,it){ return a+weight(it); },0), r=Math.random()*tot;
  for(var i=0;i<p.length;i++){ r-=weight(p[i]); if(r<0) return p[i]; }
  return p[p.length-1];
}
function next(){
  var p=pool(), pick=pickOne(p), tries=0;
  while(p.length>1&&cur&&pick===cur&&tries++<5) pick=pickOne(p);
  cur=pick; shown=cur.gen?cur.gen():cur; revealed=false; graded=false;
  hush(); elSay.classList.add('hide');
  elGlyph.innerHTML=shown.svg;
  elIn.placeholder=cur.ph||'type what it says (optional)';
  elAnsBox.classList.add('hide'); elVer.classList.add('hide'); elHint.classList.remove('hide');
  elHint.textContent='tap to reveal'; elIn.value=''; elErr.textContent='';
}
function reveal(counted){
  if(revealed) return;
  revealed=true;
  elAns.textContent=shown.ans; elAns.className=(cur.long?'long':'')+(cur.ansIpa?' ipa':'');
  elMeta.innerHTML=shown.meta||''; elMeta2.innerHTML=shown.meta2||'';
  elAnsBox.classList.remove('hide');

}
function missed(){ S.miss[cur.id]=Math.min((S.miss[cur.id]||0)+1,5); sessionMiss[cur.id]=(sessionMiss[cur.id]||0)+1; }

/* ---------- checking an answer ---------- */
function base(s){ return s.toLowerCase().replace(/[’‘]/g,"'").replace(/[“”]/g,'"').replace(/\s+/g,' ').trim(); }
function wordNorm(s){ return base(s).replace(/[^a-z0-9' ]/g,'').replace(/'/g,''); }
function tokNorm(s){ return base(s).replace(/^[^a-z0-9]+|[^a-z0-9]+$/g,'').replace(/'/g,''); }
function isRight(typed){
  var k=cur.kind;
  if(k==='sentence'){
    var t=base(typed).split(' ').map(tokNorm).filter(Boolean);
    if(t.length!==cur.words.length) return false;
    return cur.words.every(function(w,i){
      if(w.num) return t[i]===w.num.toLowerCase()||t[i]===w.num.replace(/,/g,'');
      return w.alt.some(function(a){ return wordNorm(a)===t[i]; }); });
  }
  var all=[shown.ans].concat(shown.alt||[]);
  if(k==='text'){ var n=wordNorm(typed); return all.some(function(a){ return wordNorm(a)===n; }); }
  if(k==='num'){ var m=base(typed).replace(/[\s ]/g,''); return all.some(function(a){ return base(a).replace(/\s/g,'')===m; }); }
  var b=base(typed); return all.some(function(a){ return base(a)===b; });
}
function grade(){
  if(graded){ next(); return; }
  var raw=elIn.value;
  if(!raw.trim()){ elErr.textContent='Type an answer first, or tap the card to reveal it.'; elIn.focus(); return; }
  elErr.textContent='';
  var ok=isRight(raw);
  graded=true;
  if(ok){ S.correct++; if(S.miss[cur.id]){ S.miss[cur.id]--; if(!S.miss[cur.id]) delete S.miss[cur.id]; } }
  else { S.wrong++; missed(); }
  save(); paint();
  elVer.className='verdict '+(ok?'ok':'bad');
  elVer.textContent=ok?'Correct':'Not quite — '+shown.ans;
  reveal(true);
}

elCard.addEventListener('click',function(){ if(!revealed) reveal(false); else next(); });
elCard.addEventListener('keydown',function(e){ if(e.target!==elCard) return; if(e.key==='Enter'||e.key===' '){ e.preventDefault(); if(!revealed) reveal(false); else next(); } });
$('check').addEventListener('click',grade);
elSay.addEventListener('click',function(e){ e.stopPropagation(); if(sayable()) play(shown.say); });
function paintSound(){ elSound.setAttribute('aria-pressed',S.sound?'true':'false'); elSound.title=S.sound?'Sound is on: each answer is spoken when it is shown':'Sound is off'; }
elSound.addEventListener('click',function(){ S.sound=!S.sound; save(); paintSound(); if(!S.sound) hush(); else if(revealed&&sayable()) play(shown.say); });
if(!audioOK) elSound.classList.add('hide');
paintSound();
elIn.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); if(graded) next(); else grade(); } });
elIn.addEventListener('input',function(){ if(elErr.textContent) elErr.textContent=''; });

CATS.forEach(function(c){
  var b=document.createElement('button');
  b.type='button'; b.className='chip'; b.textContent=c[1]; b.setAttribute('aria-pressed',S.cats[c[0]]?'true':'false');
  b.addEventListener('click',function(){
    S.cats[c[0]]=!S.cats[c[0]];
    b.setAttribute('aria-pressed',S.cats[c[0]]?'true':'false');
    save(); next();
  });
  elChips.appendChild(b);
});

$('finish').addEventListener('click',function(){
  var t=S.correct+S.wrong;
  $('pct').textContent=t?Math.round(S.correct/t*100)+'%':'—';
  $('sDetail').textContent=t?S.correct+' correct of '+t+' typed':'No typed answers this session';
  $('sRevDetail').textContent=S.revealed+' revealed without answering';
  var ids=Object.keys(sessionMiss).sort(function(a,b){ return sessionMiss[b]-sessionMiss[a]; }).slice(0,6);
  var names=ids.map(function(id){ var it=ITEMS.filter(function(x){ return x.id===id; })[0]; return it?(it.gen?'numbers':it.ans):null; })
    .filter(function(v,i,a){ return v&&a.indexOf(v)===i; });
  $('sMiss').innerHTML=names.length?'Coming back more often: <b>'+names.map(esc).join(', ')+'</b>':'';
  hush(); elCard.classList.add('hide'); elFoot.classList.add('hide'); elChips.classList.add('hide');
  elSum.classList.remove('hide');
  S.correct=0; S.wrong=0; S.revealed=0; sessionMiss={}; save(); paint();
});
$('again').addEventListener('click',function(){
  elSum.classList.add('hide'); elCard.classList.remove('hide'); elFoot.classList.remove('hide'); elChips.classList.remove('hide');
  next();
});

paint(); next();
window.__st={items:ITEMS,get cur(){ return cur; },get shown(){ return shown; },isRight:function(s){ return isRight(s); },next:next,
  sounds:SND,clip:clip,play:play,get live(){ return LIVE.length; },get ac(){ return AC; }};
})();
</script>
</body>
</html>
